services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vss
      POSTGRES_USER: vss
      POSTGRES_PASSWORD: vss
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vss -d vss"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
