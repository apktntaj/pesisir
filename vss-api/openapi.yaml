openapi: 3.1.0
info:
  title: VSS Operations API
  version: 0.1.0
  description: REST API awal untuk Event Organizer, Venue, Contact, dan Event.
servers:
  - url: http://127.0.0.1:3001
paths:
  /health:
    get:
      summary: Check API and PostgreSQL health
      responses:
        '200': { description: API and database are available }
        '503': { description: Database is unavailable }
  /api/v1/event-organizers:
    get: { summary: List event organizers }
    post: { summary: Create an event organizer }
  /api/v1/event-organizers/{id}:
    get: { summary: Get event organizer with contacts }
    patch: { summary: Update event organizer }
    delete: { summary: Delete unused event organizer }
  /api/v1/event-organizers/{id}/contacts:
    post: { summary: Create and attach a contact }
  /api/v1/venues:
    get: { summary: List venues }
    post: { summary: Create a venue }
  /api/v1/venues/{id}:
    get: { summary: Get venue with contacts }
    patch: { summary: Update venue }
    delete: { summary: Delete unused venue }
  /api/v1/venues/{id}/contacts:
    post: { summary: Create and attach a contact }
  /api/v1/contacts/{id}:
    patch: { summary: Update contact }
    delete: { summary: Delete contact and its links }
  /api/v1/events:
    get:
      summary: List events
      parameters:
        - { name: eventOrganizerId, in: query, schema: { type: string, format: uuid } }
        - { name: venueId, in: query, schema: { type: string, format: uuid } }
        - { name: startsFrom, in: query, schema: { type: string, format: date } }
        - { name: startsUntil, in: query, schema: { type: string, format: date } }
    post: { summary: Create event }
  /api/v1/events/{id}:
    get: { summary: Get event with venue and organizer }
    patch: { summary: Update event }
    delete: { summary: Delete event }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
