services:
  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://vss:vss@postgres:5432/vss
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vss
      POSTGRES_USER: vss
      POSTGRES_PASSWORD: vss
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vss -d vss"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
